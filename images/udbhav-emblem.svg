<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-label="UDBHAV 2K26 Official Emblem">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="25%" stop-color="#f5d98b"/>
      <stop offset="50%" stop-color="#d8a84e"/>
      <stop offset="75%" stop-color="#ab7b29"/>
      <stop offset="100%" stop-color="#f5d98b"/>
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d8a84e"/>
      <stop offset="40%" stop-color="#fff0c9"/>
      <stop offset="60%" stop-color="#e6bc65"/>
      <stop offset="100%" stop-color="#9a6e21"/>
    </linearGradient>

    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d0b16"/>
      <stop offset="50%" stop-color="#24070e"/>
      <stop offset="100%" stop-color="#140307"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g id="udbhavEmblemGroup">
    <!-- Top Radiant Star -->
    <g transform="translate(200, 38)" filter="url(#goldGlow)">
      <!-- 8-pointed celestial star -->
      <path d="M0 -18 L3 -5 L16 0 L3 5 L0 18 L-3 5 L-16 0 L-3 -5 Z" fill="#fff9e6"/>
      <path d="M0 -22 L2 -4 L20 0 L2 4 L0 22 L-2 4 L-20 0 L-2 -4 Z" fill="url(#goldLinear)" opacity="0.85"/>
      <path d="M-8 -8 L0 -2 L8 -8 L2 0 L8 8 L0 2 L-8 8 L-2 0 Z" fill="url(#goldLinear)" opacity="0.6"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Outer Circular Gold Ring Frame -->
    <circle cx="200" cy="180" r="146" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" opacity="0.95"/>
    <circle cx="200" cy="180" r="141" fill="none" stroke="url(#goldLinear)" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
    <circle cx="200" cy="180" r="137" fill="none" stroke="url(#goldLinear)" stroke-width="0.75" opacity="0.45"/>

    <!-- Flanking Laurel Wreaths -->
    <!-- Left Laurel Branch -->
    <g fill="url(#goldLinear)" opacity="0.9">
      <path d="M78 245 C70 215 76 175 98 140 C95 158 97 185 106 205 C101 220 92 235 78 245 Z"/>
      <path d="M82 220 C72 195 78 160 102 130 C98 148 102 170 110 188 C104 200 96 212 82 220 Z"/>
      <path d="M92 185 C84 165 92 135 116 112 C110 128 114 150 122 165 C114 175 105 182 92 185 Z"/>
      <path d="M106 150 C100 132 108 108 132 88 C125 104 130 125 138 138 C128 145 118 150 106 150 Z"/>
      <path d="M125 118 C120 102 128 82 152 68 C144 82 148 100 156 112 C145 118 136 120 125 118 Z"/>
      <path d="M148 90 C144 76 152 60 174 50 C166 62 170 78 176 88 C166 92 158 92 148 90 Z"/>
    </g>

    <!-- Right Laurel Branch (Mirror) -->
    <g fill="url(#goldLinear)" opacity="0.9">
      <path d="M322 245 C330 215 324 175 302 140 C305 158 303 185 294 205 C299 220 308 235 322 245 Z"/>
      <path d="M318 220 C328 195 322 160 298 130 C302 148 298 170 290 188 C296 200 304 212 318 220 Z"/>
      <path d="M308 185 C316 165 308 135 284 112 C290 128 286 150 278 165 C286 175 295 182 308 185 Z"/>
      <path d="M294 150 C300 132 292 108 268 88 C275 104 270 125 262 138 C272 145 282 150 294 150 Z"/>
      <path d="M275 118 C280 102 272 82 248 68 C256 82 252 100 244 112 C255 118 264 120 275 118 Z"/>
      <path d="M252 90 C256 76 248 60 226 50 C234 62 230 78 224 88 C234 92 242 92 252 90 Z"/>
    </g>

    <!-- Celebration Crowd Silhouette & Stage Rays (Inside U Bowl) -->
    <g opacity="0.85">
      <!-- Radiating stage spotlight rays -->
      <polygon points="200,165 170,110 185,105" fill="url(#goldSheen)" opacity="0.18"/>
      <polygon points="200,165 192,95 208,95" fill="url(#goldSheen)" opacity="0.25"/>
      <polygon points="200,165 215,105 230,110" fill="url(#goldSheen)" opacity="0.18"/>

      <!-- Cheering crowd silhouette with raised arms -->
      <path d="M165 178 Q172 165 176 160 Q180 168 185 162 Q190 166 193 158 Q196 164 200 155 Q204 164 207 158 Q210 166 215 162 Q220 168 224 160 Q228 165 235 178 Z" fill="#20050b"/>
      <!-- Crowd highlights in antique gold -->
      <circle cx="176" cy="158" r="2.2" fill="url(#goldLinear)"/>
      <circle cx="185" cy="159" r="2" fill="url(#goldLinear)"/>
      <circle cx="193" cy="156" r="2.2" fill="url(#goldLinear)"/>
      <circle cx="200" cy="153" r="2.5" fill="#fff9e6"/>
      <circle cx="207" cy="156" r="2.2" fill="url(#goldLinear)"/>
      <circle cx="215" cy="159" r="2" fill="url(#goldLinear)"/>
      <circle cx="224" cy="158" r="2.2" fill="url(#goldLinear)"/>
      <!-- Raised celebratory arms -->
      <line x1="174" y1="162" x2="170" y2="152" stroke="url(#goldLinear)" stroke-width="1.2"/>
      <line x1="187" y1="162" x2="184" y2="150" stroke="url(#goldLinear)" stroke-width="1.2"/>
      <line x1="198" y1="156" x2="195" y2="145" stroke="url(#goldLinear)" stroke-width="1.4"/>
      <line x1="202" y1="156" x2="205" y2="145" stroke="url(#goldLinear)" stroke-width="1.4"/>
      <line x1="213" y1="162" x2="216" y2="150" stroke="url(#goldLinear)" stroke-width="1.2"/>
      <line x1="226" y1="162" x2="230" y2="152" stroke="url(#goldLinear)" stroke-width="1.2"/>
    </g>

    <!-- The Majestic Phoenix-Inspired U Lettermark -->
    <g filter="url(#goldGlow)">
      <!-- Left Stem of U (Classic Chiseled Serif) -->
      <path d="M142 82 L172 82 L168 96 L164 150 C164 172 178 188 200 188 C222 188 236 172 236 150 L232 96 L228 82 L258 82 L254 96 L248 148 C248 180 228 202 200 202 C172 202 152 180 152 148 L146 96 Z" fill="url(#goldLinear)" stroke="#9a6e21" stroke-width="0.8"/>
      <!-- Left Serif Foot & Finials -->
      <path d="M136 82 L178 82 L172 88 L142 88 Z" fill="#fff5db"/>

      <!-- Phoenix Wing & Rising Flame Sweeping Upwards to the Right -->
      <path d="M136 160 C150 148 180 120 220 102 C245 92 270 78 282 52 C276 68 262 82 245 92 C210 110 178 135 155 168 C145 180 138 172 136 160 Z" fill="url(#goldSheen)"/>
      <!-- Secondary Phoenix Feather Flame -->
      <path d="M185 130 C215 110 248 94 274 72 C265 84 252 96 235 106 C205 124 180 146 165 170 C172 154 180 140 185 130 Z" fill="#fff0c9" opacity="0.9"/>
      <!-- Phoenix Crest Feathers at Peak -->
      <path d="M282 52 C295 44 310 40 318 48 C310 52 300 56 292 64 C286 58 284 54 282 52 Z" fill="url(#goldLinear)"/>
      <path d="M275 66 C288 58 302 56 312 62 C302 66 294 72 286 80 C280 74 277 70 275 66 Z" fill="url(#goldLinear)"/>
      <path d="M265 82 C278 74 290 74 298 80 C290 84 282 90 276 96 C270 90 267 86 265 82 Z" fill="url(#goldLinear)"/>
      <!-- Phoenix Head Profile -->
      <path d="M305 52 C308 48 314 46 318 48 C316 52 312 55 308 56 Z" fill="#ffffff"/>
    </g>

    <!-- Chiselled "UDBHAV" Typography -->
    <text x="200" y="242" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="4" fill="url(#goldLinear)" stroke="#744f12" stroke-width="0.8" text-anchor="middle" filter="url(#goldGlow)">UDBHAV</text>
    <text x="200" y="242" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="4" fill="url(#goldSheen)" text-anchor="middle">UDBHAV</text>

    <!-- "✦ 2K26 ✦" -->
    <g transform="translate(200, 268)">
      <text x="0" y="0" font-family="'Cinzel', serif" font-size="22" font-weight="700" letter-spacing="6" fill="url(#goldLinear)" text-anchor="middle">2K26</text>
      <!-- Left decorative dash & diamond -->
      <line x1="-88" y1="-6" x2="-48" y2="-6" stroke="url(#goldLinear)" stroke-width="1.5"/>
      <polygon points="-44,-6 -41,-9 -38,-6 -41,-3" fill="url(#goldLinear)"/>
      <!-- Right decorative dash & diamond -->
      <line x1="48" y1="-6" x2="88" y2="-6" stroke="url(#goldLinear)" stroke-width="1.5"/>
      <polygon points="44,-6 41,-9 38,-6 41,-3" fill="url(#goldLinear)"/>
    </g>

    <!-- Arched Ribbon Banner: "JSS MCA DHARWAD" -->
    <g transform="translate(0, 10)">
      <!-- Banner Background Ribbon with Split Swallowtail Ends -->
      <!-- Left Swallowtail Ribbon Tail -->
      <path d="M78 298 L110 286 L110 314 L78 326 L92 312 Z" fill="#20050b" stroke="url(#goldLinear)" stroke-width="1.2"/>
      <!-- Right Swallowtail Ribbon Tail -->
      <path d="M322 298 L290 286 L290 314 L322 326 L308 312 Z" fill="#20050b" stroke="url(#goldLinear)" stroke-width="1.2"/>

      <!-- Main Banner Body Arc -->
      <path d="M102 284 Q200 304 298 284 L294 318 Q200 338 106 318 Z" fill="url(#bannerGrad)" stroke="url(#goldLinear)" stroke-width="1.8"/>
      <!-- Banner Inner Gold Accent Line -->
      <path d="M108 288 Q200 307 292 288" fill="none" stroke="url(#goldLinear)" stroke-width="0.8" opacity="0.7"/>
      <path d="M110 314 Q200 333 290 314" fill="none" stroke="url(#goldLinear)" stroke-width="0.8" opacity="0.7"/>

      <!-- Banner Text: JSS MCA DHARWAD (Letter-by-letter arched alignment or curved path) -->
      <path id="bannerTextArc" d="M114 308 Q200 326 286 308" fill="none"/>
      <text font-family="'Cinzel', serif" font-size="13" font-weight="700" letter-spacing="3" fill="url(#goldSheen)">
        <textPath href="#bannerTextArc" startOffset="50%" text-anchor="middle">JSS MCA DHARWAD</textPath>
      </text>
    </g>

    <!-- Base: Open Book Symbol of Learning & Academic Pride -->
    <g transform="translate(200, 348)" stroke="url(#goldLinear)" fill="none">
      <!-- Left Book Page -->
      <path d="M-22 0 Q-10 -8 0 -2 L0 10 Q-10 4 -22 10 Z" fill="#20050b" stroke-width="1.4"/>
      <!-- Right Book Page -->
      <path d="M22 0 Q10 -8 0 -2 L0 10 Q10 4 22 10 Z" fill="#20050b" stroke-width="1.4"/>
      <!-- Center Book Spine -->
      <line x1="0" y1="-2" x2="0" y2="10" stroke-width="1.6"/>
      <!-- Under-book Ornamental Flourish Arc -->
      <path d="M-36 12 Q0 22 36 12" stroke-width="1.2"/>
      <circle cx="-38" cy="11" r="1.5" fill="url(#goldLinear)"/>
      <circle cx="38" cy="11" r="1.5" fill="url(#goldLinear)"/>
      <circle cx="0" cy="18" r="2" fill="url(#goldLinear)"/>
    </g>
  </g>
</svg>

